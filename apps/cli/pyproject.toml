[project]
name = "openmagpie-cli"
version = "0.1.0"
description = "The magpie CLI — talks to an OpenMagpie server."
requires-python = ">=3.13"
dependencies = [
    "typer>=0.12",
    "httpx>=0.28",
    "openmagpie-schema",
    "pydantic>=2.5",
    "pyyaml>=6.0",
]

[project.scripts]
magpie = "openmagpie.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.11",
    "ty>=0.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openmagpie"]

# openmagpie-schema is resolved as a workspace member; the workspace
# source is declared once at the repo-root pyproject (applies to all
# members). See project memory project_schema_authority_northstar.
#
# NOT yet standalone-installable: openmagpie-schema is workspace-only
# and unpublished, so `pipx install` / `uv tool install` / pip from
# this dir cannot resolve it. The CLI IS intended for standalone
# distribution, so this must be resolved first (publish openmagpie-
# schema to PyPI, or vendor it into the wheel). Tracked in project
# memory: project_followup_cli_standalone_dist.
