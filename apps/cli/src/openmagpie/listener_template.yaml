# Magpie listener config.
#
# A listener is an attention over a Feed: it judges the Feed's items with
# your instructions + engine and notifies you on hits. Create the Feed
# first (`magpie feed template` / `magpie feed create`), then point this
# listener at it by id.
#
# Save and run:
#   magpie listener create -f listener.yaml
#
# Or pipe through stdin (--yes required, no TTY to confirm on):
#   magpie listener template | magpie listener create -f - --yes

name: my-listener
instructions: |
  What should the engine consider a hit? Plain-English criteria
  the LLM reads verbatim. Be specific about what counts AND what
  doesn't, e.g. "Posts about X, but skip jokes and ads."

kind: semantic
delivery_mode: digest      # 'instant' = fire per hit; 'digest' = batch

data:
  # The Feed this listener subscribes to (run `magpie feed list` for ids).
  # The listener judges every item the Feed produces across all its streams.
  feed_id: REPLACE_WITH_FEED_ID

  engine:
    kind: ollama
    model: qwen2.5:7b

  notifiers:
    - kind: log
      prefix: "[my-listener]"
      include_fields: []
    # - kind: webhook
    #   url: https://example.com/hook
    #   headers: {}
    #   include_fields: []

  hit_threshold: 0.7            # engine score >= this counts as a hit
  digest_interval_seconds: 3600 # only consulted when delivery_mode = digest
