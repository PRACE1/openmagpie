target-version = "py313"
line-length = 120

# uv-workspace member source roots, so ruff's isort resolves
# first-party imports correctly now that packages live under apps/ and
# packages/ (was implicitly the cwd before the monorepo reshuffle).
src = [
    "apps/core",
    "apps/cli/src",
    "packages/openmagpie-schema/src",
]

[lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "PIE", "T20", "SIM", "RUF"]
ignore = [
    "E402",    # module-import-not-at-top-of-file (Django pattern)
    "E501",    # line too long (handled by formatter)
    "RUF012",  # mutable class attributes (common in Django models)
    "SIM102",  # collapsible-if (nested ifs can be more readable)
]

[lint.per-file-ignores]
"**/scripts/*.py" = ["SIM115", "T201"]

[lint.isort]
known-first-party = ["conf"]

[format]
quote-style = "double"
